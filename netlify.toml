[build]
  command = "npm run build"
  publish = "build"

# Site statique : toute adresse sans fichier correspondant renvoie vers l'application (les vrais fichiers restent prioritaires)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

# En-têtes de sécurité (pas de CSP stricte : SvelteKit injecte de petits scripts en ligne)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
